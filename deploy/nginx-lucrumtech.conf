# /etc/nginx/sites-available/lucrumtech
#
# Derived from the live config that served the old site — the three-server
# structure (80 -> https, www -> non-www, non-www serves) and the certbot
# TLS includes are preserved as they were. What changed: the SPA fallback
# (try_files ... /index.html) is gone, because the site is now real pages and
# unknown paths must 404 rather than silently return the homepage.

server {
    listen 80;
    server_name lucrumtech.com www.lucrumtech.com;

    return 301 https://lucrumtech.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.lucrumtech.com;

    ssl_certificate /etc/letsencrypt/live/lucrumtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucrumtech.com/privkey.pem;

    return 301 https://lucrumtech.com$request_uri;
}

server {
    listen 443 ssl;
    server_name lucrumtech.com;

    root /var/www/lucrumtech;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/lucrumtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucrumtech.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Contact form -> the existing email-api FastAPI service (systemd:
    # email-api.service). Unchanged from the old config; the new form posts
    # multipart/form-data to /api/website/send-email.
    location /api/website/ {
        # See deploy/nginx-formguard.conf. A submission must carry an Origin
        # from this site and speak HTTP/1.1 or better. Referer is deliberately
        # not accepted: the spam bot forges it.
        access_log /var/log/nginx/lucrumtech-form.log lt_form;

        if ($lt_blocked_ip) {
            return 403;
        }

        if ($lt_form_denied) {
            return 403;
        }

        limit_req zone=lt_contact burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The localised privacy pages briefly lived at /privacy/<lang> before the
    # rest of the site was translated. They are /<lang>/privacy now, like every
    # other page, so send the old shape on rather than 404ing it.
    location ~ ^/privacy/(es|de|fr)$ {
        return 301 /$1/privacy;
    }

    # The .html files are an implementation detail — only the extensionless URL
    # is canonical, so collapse the duplicates rather than serving both. ('if'
    # with 'return' is the one form of 'if' that is safe inside a server block.)
    # /index.html is matched first so it goes straight to / in one hop.
    if ($uri = /index.html) {
        return 301 /$is_args$args;
    }

    if ($uri ~ ^/(.*)\.html$) {
        return 301 /$1$is_args$args;
    }

    if ($uri = /index) {
        return 301 /$is_args$args;
    }

    # Astro builds with format:'file', so every URL maps to exactly one file
    # (/services -> services.html). Serving the file directly avoids a 301
    # trailing-slash hop on every page.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # Hashed build assets are safe to cache hard; HTML is not listed here so it
    # keeps revalidating and content edits go live on the next request.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:svg|png|ico|webp|avif|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
