# /etc/nginx/conf.d/lucrumtech-formguard.conf
#
# Abuse protection for the lucrumtech.com contact endpoint. Lives at http level
# because limit_req_zone and map can only be declared there; nothing here takes
# effect until it is referenced, which only the lucrumtech vhost does, so the
# other sites on this server are unaffected.
#
# Context: in September 2026 a bot posted ~280 submissions straight at
# /api/website/send-email over two days. The form's honeypot is enforced in
# browser JavaScript, which a direct POST never runs, and the FastAPI service
# behind it validates nothing. The origin check below is what actually stops
# that; the rate limit is a backstop against a burst flood.

limit_req_zone $binary_remote_addr zone=lt_contact:10m rate=10r/m;

# Browsers send Origin on a cross-document POST, including same-origin ones.
map $http_origin $lt_origin_ok {
    default                      0;
    "https://lucrumtech.com"     1;
    "https://www.lucrumtech.com" 1;
}

# Referer is the fallback for any client that omits Origin.
map $http_referer $lt_referer_ok {
    default                                 0;
    "~^https://(www\.)?lucrumtech\.com(/|$)" 1;
}

# Deny only when neither signal is present — one of the two is enough.
map "$lt_origin_ok$lt_referer_ok" $lt_form_denied {
    default 1;
    "~1"    0;
}
