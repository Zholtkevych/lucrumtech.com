# /etc/nginx/conf.d/lucrumtech-formguard.conf
#
# Abuse protection for the lucrumtech.com contact endpoint. Lives at http level
# because limit_req_zone, map, geo and log_format can only be declared there;
# nothing here takes effect until it is referenced, and only the lucrumtech
# vhost does, so the other sites on this server are unaffected.
#
# History: a bot posted ~280 submissions at /api/website/send-email over two
# days, all of which became mail. The form's honeypot runs in browser
# JavaScript, which a direct POST never executes, and the FastAPI service
# behind it validates nothing. A first version of this file accepted either
# Origin or Referer; the bot simply started sending
# "Referer: https://lucrumtech.com/contact" and walked straight back in.
#
# Two signals separate it from a real browser, both verified against live
# traffic and a real Chromium submission:
#   - a browser sends Origin on a cross-document POST; this bot sends only Referer
#   - this bot speaks HTTP/1.0, which no browser does over TLS
# Both must hold. Referer is no longer trusted for anything.

limit_req_zone $binary_remote_addr zone=lt_contact:10m rate=10r/m;

map $http_origin $lt_origin_ok {
    default                      0;
    "https://lucrumtech.com"     1;
    "https://www.lucrumtech.com" 1;
}

map $server_protocol $lt_proto_ok {
    default    0;
    "HTTP/1.1" 1;
    "HTTP/2.0" 1;
    "HTTP/3.0" 1;
}

map "$lt_origin_ok$lt_proto_ok" $lt_form_denied {
    default 1;
    "11"    0;
}

# Immediate relief for the current offender. A stopgap — it rotates addresses,
# so the header checks above are what actually holds the line.
geo $lt_blocked_ip {
    default      0;
    80.94.95.173 1;
    45.148.10.183 1;
}

# Dedicated log so refusals are visible and the next adaptation is diagnosable.
log_format lt_form '$remote_addr $status $server_protocol '
                   'origin="$http_origin" ref="$http_referer" ua="$http_user_agent"';
